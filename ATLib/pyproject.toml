[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlib-telegram"
version = "1.0.0"
description = "Advanced Telegram Bot Library — production-ready asynchronous framework for the official Telegram Bot API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ATLib Contributors"}]
keywords = ["telegram", "bot", "api", "async", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]
redis = ["redis>=5"]
postgres = ["asyncpg>=0.29"]
dotenv = ["python-dotenv>=1.0"]
asgi = ["starlette>=0.37", "uvicorn>=0.30"]
full = ["redis>=5", "asyncpg>=0.29", "python-dotenv>=1.0", "starlette>=0.37"]

[project.scripts]
atlib = "atlib.cli.main:main"

[project.urls]
Homepage = "https://github.com/atlib/atlib"
Documentation = "https://github.com/atlib/atlib#readme"
Repository = "https://github.com/atlib/atlib"

[tool.hatch.build.targets.wheel]
packages = ["atlib"]

[tool.hatch.build.targets.sdist]
include = [
    "/atlib",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/README.fa.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/API_COVERAGE.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real Telegram bot token",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
